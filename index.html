<!DOCTYPE html>
<!-- 作成日: 2026-11-08 -->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桃太郎の鬼退治</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 画面は section で分ける。表示する画面にだけ is-active クラスを付ける -->
  <div id="app">

    <!-- タイトル画面 -->
    <section id="screen-title" class="screen is-active">
      <img id="scene-start" class="scene-img" src="" alt="">
      <h1 class="title-text">桃太郎の鬼退治</h1>
      <p class="description">左・中央・右の3マスから1つを選んで、鬼を避けながら進もう。<br>仲間と力を合わせて、でかい鬼をやっつけよう！</p>
      <button id="btn-start" class="btn btn-main">スタート</button>
    </section>

    <!-- ゲーム画面（通常ステージとボス戦で共通） -->
    <section id="screen-game" class="screen">
      <!-- ヘッダー -->
      <header class="game-header">
        <span id="stage-name" class="stage-name">ステージ 1</span>
        <button id="btn-title-game" class="btn btn-small">タイトルへ</button>
      </header>

      <!-- 進捗バー（ボス戦中はボスの体力バーに切り替える） -->
      <div class="progress-area">
        <div id="progress-label" class="bar-label">0 / 10歩</div>
        <div class="bar"><div id="progress-fill" class="bar-fill progress-fill"></div></div>
      </div>

      <!-- プレイエリア：3マスを横に並べる -->
      <div id="play-area" class="play-area">
        <div id="lane-0" class="lane"></div>
        <div id="lane-1" class="lane"></div>
        <div id="lane-2" class="lane"></div>
      </div>

      <!-- 仲間表示 -->
      <div id="allies" class="allies">仲間：なし</div>

      <!-- メッセージと顔アイコン -->
      <div class="message-area">
        <div id="face" class="face"><img id="face-img" class="face-img" src="" alt="普通"></div>
        <p id="message" class="message">マスを選んでね</p>
      </div>

      <!-- 操作ボタン -->
      <div class="controls">
        <button id="btn-lane-0" class="btn btn-lane">◀</button>
        <button id="btn-lane-1" class="btn btn-lane">▲</button>
        <button id="btn-lane-2" class="btn btn-lane">▶</button>
      </div>

      <!-- 体力ゲージ -->
      <div class="hp-area">
        <div id="hp-label" class="bar-label">100 / 100</div>
        <div class="bar"><div id="hp-fill" class="bar-fill hp-fill"></div></div>
      </div>
    </section>

    <!-- ステージクリア画面 -->
    <section id="screen-clear" class="screen">
      <h2 id="clear-title" class="screen-title">ステージ1 クリア！</h2>
      <img id="clear-scene" class="clear-scene" src="" alt="">
      <p id="clear-ally" class="description">犬が仲間になった！</p>
      <p id="clear-hp" class="description">体力：100 / 100</p>
      <button id="btn-next" class="btn btn-main">次のステージへ</button>
    </section>

    <!-- ゲームオーバー画面 -->
    <section id="screen-gameover" class="screen">
      <img id="scene-gameover" class="scene-img" src="" alt="">
      <h2 class="screen-title">ゲームオーバー</h2>
      <button id="btn-retry" class="btn btn-main">リトライ</button>
      <button id="btn-title-gameover" class="btn btn-sub">タイトルへ</button>
    </section>

    <!-- エンディング画面 -->
    <section id="screen-ending" class="screen">
      <!-- 紙吹雪（飾り）：CSS アニメーションだけで動く。画面が表示されている間だけ動く -->
      <div class="confetti" aria-hidden="true">
        <i style="--x:1.5%;--s:8px;--c:#A5D6A7;--t:4.5s;--d:-0.4s;--sway:28px"></i>
        <i style="--x:4.9%;--s:12px;--c:#F58F98;--t:5.0s;--d:-1.1s;--sway:-29px"></i>
        <i style="--x:10.0%;--s:8px;--c:#FFD54F;--t:3.4s;--d:-2.1s;--sway:32px"></i>
        <i style="--x:13.2%;--s:8px;--c:#FFAB91;--t:4.5s;--d:-4.7s;--sway:33px"></i>
        <i style="--x:18.7%;--s:8px;--c:#FFD54F;--t:3.3s;--d:-4.3s;--sway:-3px"></i>
        <i style="--x:22.3%;--s:12px;--c:#F58F98;--t:4.3s;--d:-2.8s;--sway:-17px"></i>
        <i style="--x:25.4%;--s:12px;--c:#FFAB91;--t:3.6s;--d:-0.5s;--sway:-32px"></i>
        <i style="--x:30.9%;--s:12px;--c:#FFD54F;--t:4.2s;--d:-2.7s;--sway:0px"></i>
        <i style="--x:34.7%;--s:10px;--c:#81D4FA;--t:3.8s;--d:-4.0s;--sway:-9px"></i>
        <i style="--x:37.6%;--s:10px;--c:#CE93D8;--t:4.2s;--d:-1.7s;--sway:17px"></i>
        <i style="--x:42.4%;--s:8px;--c:#F58F98;--t:4.2s;--d:-0.8s;--sway:3px"></i>
        <i style="--x:46.1%;--s:10px;--c:#A5D6A7;--t:3.3s;--d:-3.3s;--sway:31px"></i>
        <i style="--x:51.4%;--s:10px;--c:#81D4FA;--t:4.6s;--d:-3.0s;--sway:34px"></i>
        <i style="--x:56.2%;--s:8px;--c:#F58F98;--t:5.1s;--d:-2.4s;--sway:-32px"></i>
        <i style="--x:58.1%;--s:12px;--c:#81D4FA;--t:4.5s;--d:-5.0s;--sway:17px"></i>
        <i style="--x:62.9%;--s:10px;--c:#FFAB91;--t:3.9s;--d:-4.7s;--sway:5px"></i>
        <i style="--x:66.6%;--s:8px;--c:#A5D6A7;--t:3.3s;--d:-3.8s;--sway:-24px"></i>
        <i style="--x:72.4%;--s:10px;--c:#A5D6A7;--t:5.0s;--d:-2.5s;--sway:-19px"></i>
        <i style="--x:75.6%;--s:12px;--c:#81D4FA;--t:5.0s;--d:-4.1s;--sway:30px"></i>
        <i style="--x:79.2%;--s:10px;--c:#81D4FA;--t:4.6s;--d:-1.9s;--sway:-11px"></i>
        <i style="--x:83.0%;--s:8px;--c:#FFD54F;--t:3.7s;--d:-1.2s;--sway:22px"></i>
        <i style="--x:89.1%;--s:8px;--c:#81D4FA;--t:3.8s;--d:-0.7s;--sway:28px"></i>
        <i style="--x:91.8%;--s:12px;--c:#81D4FA;--t:5.1s;--d:-3.5s;--sway:25px"></i>
        <i style="--x:97%;--s:12px;--c:#FFAB91;--t:4.7s;--d:-2.3s;--sway:31px"></i>
      </div>
      <img id="scene-ending" class="scene-img" src="" alt="">
      <h2 class="screen-title">鬼たいじ成功！</h2>
      <div id="ending-allies" class="ending-allies"></div>
      <button id="btn-title-ending" class="btn btn-main">タイトルへ</button>
    </section>

  </div>

  <!-- 読み込み順：jQuery → config.js → game.js
       game.js は jQuery（$）と CONFIG を使うので、それらより後に読み込む -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="config.js"></script>
  <script src="game.js"></script>
</body>
</html>
